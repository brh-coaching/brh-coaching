<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A141F">
<title>Programme maison d’automne | BRH Coaching</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏋️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@1,600;1,700;1,800&family=Saira:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A141F; --s1:#101F2D; --s2:#0C1826; --line:#1D3346;
  --text:#EAF3FA; --muted:#7E97AA;
  --force:#1CA3DD; --force-hi:#4CC3F0; --cardio:#E8833A; --warn:#E0412B; --ok:#2ECC71;
  --display:"Kanit","Arial Narrow",system-ui,sans-serif;
  --body:"Saira",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--text);font:400 17px/1.55 var(--body);padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:repeating-linear-gradient(115deg,transparent 0 90px,rgba(28,163,221,.03) 90px 92px)}
.wrap,.tabs,.bar{position:relative;z-index:1}
h1,h2,h3,h4,.verdict,.brand,.tabs button,.weeks button,.set,.kg input,#bar-label,#bar-time,.sess-head .theme,th,td:first-child,.scale button,.day .d,.day .w{font-style:italic}
.wrap{max-width:720px;margin:0 auto;padding:0 18px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--force);outline-offset:2px}
p{margin:0 0 10px}

/* En-tête */
.hero{padding:calc(26px + env(safe-area-inset-top,0px)) 0 22px}
.brand{display:flex;align-items:center;gap:12px;font:700 13px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--force-hi)}
/* Pour mettre le logo BRH : remplace le contenu de .mark par <img src="data:image/png;base64,..." alt="BRH"> */
.mark{width:104px;height:auto;display:block}
.mark img{width:100%;height:auto;display:block}
h1{font:800 clamp(40px,11vw,64px)/.92 var(--display);margin:18px 0 12px;letter-spacing:.01em;text-transform:uppercase}
h1 em{font-style:italic;color:var(--force);display:block}
.for{display:inline-flex;align-items:center;gap:8px;margin:22px 0 0;font:700 13px/1 var(--display);font-style:italic;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.for::before{content:"";width:22px;height:3px;background:var(--force);transform:skewX(-18deg)}
.for b{color:var(--force-hi);font-weight:700}
.lede{color:var(--muted);max-width:50ch;margin:0 0 22px}
.who{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.who label{color:var(--muted);font-size:15px}
.who input{background:var(--s1);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px 12px;font:inherit;width:220px;max-width:100%}
.weeks{margin-top:22px}
.weeks .lbl{color:var(--muted);font-size:15px}
.weeks .row{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:8px}
.weeks button{background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:11px 0;font:600 19px/1 var(--display)}
.weeks button.on{background:linear-gradient(120deg,var(--force),var(--force-hi));border-color:var(--force);color:#07131C}
.weeks .phase{color:var(--muted);font-size:15px;margin-top:9px}
.weeks .phase b{color:var(--text);font-weight:600}

/* Onglets */
.tabs{position:sticky;top:0;z-index:5;background:rgba(10,20,31,.92);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:15px 12px 12px;font:600 20px/1 var(--display);color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--force-hi);border-color:var(--force)}
main{padding-top:8px}

/* Guide */
h2{font:800 30px/1.05 var(--display);margin:38px 0 14px;text-transform:uppercase;letter-spacing:.02em}
h3{font:700 22px/1.1 var(--display);margin:0;text-transform:uppercase;letter-spacing:.02em}
.answer{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:22px 20px 14px;margin-top:24px}
.answer h2{margin:0 0 10px;font-size:26px;color:var(--muted)}
.verdict{font:600 clamp(28px,7vw,40px)/1.05 var(--display);margin:0 0 16px}
ul.plain{margin:0;padding-left:20px}
ul.plain li{margin-bottom:8px}
ul.plain li::marker{color:var(--force)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:10px 6px 12px;text-align:center;min-height:96px;border-top:3px solid var(--line)}
.day .d{font:600 16px/1 var(--display);color:var(--muted)}
.day .w{font:700 24px/1.1 var(--display);margin-top:8px}
.day .t{font-size:13px;line-height:1.3;color:var(--muted);margin-top:4px}
.day.f{border-top-color:var(--force)} .day.f .w{color:var(--force)}
.day.c{border-top-color:var(--cardio)} .day.c .w{color:var(--cardio)}
@media (max-width:560px){.days{grid-template-columns:repeat(4,1fr)}}
.note{color:var(--muted);font-size:15px;margin-top:12px}
.alert{border:1px solid var(--warn);border-radius:12px;padding:14px 16px;margin-top:16px}
.alert h3{color:var(--warn);font-size:20px;margin-bottom:6px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:15px}
th,td{text-align:left;padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 17px/1.2 var(--display);color:var(--muted)}
td:first-child{font:700 18px/1.2 var(--display);white-space:nowrap}
ol.howto{padding-left:22px;margin:0}
ol.howto li{margin-bottom:8px}

/* Séance */
.sess-head{padding:26px 0 6px}
.sess-head h2{margin:0;font-size:40px}
.sess-head .theme{font:600 22px/1.2 var(--display);color:var(--force);margin-top:4px}
.sess-head .meta{color:var(--muted);font-size:15px;margin-top:10px}
details{background:var(--s1);border-radius:12px;margin:16px 0}
summary{padding:14px 16px;font:600 20px/1.1 var(--display);cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:24px;color:var(--muted)}
details[open] summary::after{content:"–"}
details ol{margin:0;padding:0 16px 14px 38px}
details li{margin-bottom:8px}
details li span{display:block;color:var(--muted);font-size:15px}
.block{margin-top:30px}
.block-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:10px}
.block-head p{color:var(--muted);font-size:15px;margin:2px 0 0}
.rest-btn{flex:none;background:var(--s2);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:15px;font-weight:600}
.ex{background:var(--s1);border:1px solid var(--line);border-radius:14px;border-left:3px solid var(--force);padding:16px;margin-bottom:10px}
.ex-top{display:flex;gap:14px;align-items:flex-start}
.pic{flex:none;width:58px;height:58px;border-radius:10px;background:var(--s2);color:var(--force);display:grid;place-items:center}
.pic svg{width:46px;height:46px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.ex h4{font:600 21px/1.15 var(--display);margin:2px 0 4px}
.dose{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:15px;color:var(--muted);margin:0}
.dose b{color:var(--text);font-weight:600}
.illu{margin:14px 0 2px;background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:10px 8px 4px}
.illu svg{width:100%;height:auto;display:block;font-family:var(--body)}
dl.how{margin:14px 0 0;display:grid;gap:10px}
dl.how dt{font:700 12.5px/1 var(--display);font-style:italic;letter-spacing:.12em;text-transform:uppercase;color:var(--force-hi)}
dl.how dt.av{color:var(--cardio)}
dl.how dd{margin:4px 0 0;font-size:15.5px;line-height:1.5;color:#D3E1EC}
.cues{margin:12px 0 0;padding-left:20px;font-size:15px;color:#C2D3E0}
.cues li{margin-bottom:4px}
.track{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap}
.sets{display:flex;gap:8px}
.set{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:none;font:600 18px/1 var(--display)}
.set.on{background:var(--ok);border-color:var(--ok);color:#07131C}
.kg{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:15px}
.kg input{width:70px;background:var(--s2);border:1px solid var(--line);border-radius:8px;color:var(--text);font:600 18px/1 var(--display);padding:9px 8px;text-align:center}
.small{font-size:14px;color:var(--muted)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.primary{background:linear-gradient(120deg,var(--force),var(--force-hi));color:#07131C;border:0;border-radius:10px;padding:12px 16px;font-weight:600}
.ghost{background:none;border:1px solid var(--line);border-radius:10px;padding:12px 16px;color:var(--muted)}
.ghost[aria-pressed="true"]{border-color:var(--cardio);color:var(--cardio)}
.scale{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.scale button,.choice button{background:var(--s1);border:1px solid var(--line);border-radius:8px;padding:10px 0;font:600 17px/1 var(--display)}
.scale button.on,.choice button.on{background:linear-gradient(120deg,var(--force),var(--force-hi));border-color:var(--force);color:#07131C}
.choice{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.choice button{font:500 15px/1.2 var(--body);padding:11px 4px}
textarea{width:100%;background:var(--s1);border:1px solid var(--line);border-radius:10px;color:var(--text);font:inherit;padding:12px}

/* Chrono */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--s2);border-top:3px solid var(--muted);padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px))}
.bar[hidden]{display:none}
.bar .in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:14px}
.bar.work{border-top-color:var(--cardio)} .bar.prep{border-top-color:var(--force)}
.bar-info{flex:1;min-width:0}
#bar-label{display:block;font:700 20px/1.1 var(--display)}
.bar.work #bar-label{color:var(--cardio)} .bar.prep #bar-label{color:var(--force)}
#bar-sub{display:block;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar-time{font:700 44px/1 var(--display);font-variant-numeric:tabular-nums;min-width:3ch;text-align:right}
#bar-stop{background:none;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px}
footer{color:var(--muted);font-size:13px;margin-top:48px}
footer b{color:var(--force);font-family:var(--display);font-style:italic}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>

function phase(w){
  if(w<=2) return { name:"Reprise", d:-1, r:-2, effort:"Choisis une charge où il te reste 3 répétitions en réserve" };
  if(w<=4) return { name:"Construction", d:0, r:0, effort:"Il doit te rester 2 répétitions en réserve en fin de série" };
  return { name:"Progression", d:0, r:2, effort:"Il te reste 1 à 2 répétitions : ajoute 1 à 2 kg dès que la série passe facilement" };
}
const nSets = E => Math.max(2, E.sets + phase(state.week).d);
const nRounds = F => F.rounds + phase(state.week).r;

/* ---------- État et sauvegarde ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const slug = s => (s||"").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") || "invite";
const LAST = "brh_maison_last";
let state = { name:"Delphine", week:1, tab:"guide", log:{} };

function key(){ return "brh_maison_" + slug(state.name); }
function save(){
  try{
    localStorage.setItem(LAST, JSON.stringify({ name:state.name, tab:state.tab }));
    localStorage.setItem(key(), JSON.stringify({ week:state.week, log:state.log }));
  }catch(e){}
}
function loadAthlete(carry){
  let d = {};
  try{ d = JSON.parse(localStorage.getItem(key()) || "{}"); }catch(e){}
  if(carry && !d.log){ save(); return; }
  state.log = d.log || {};
  state.week = d.week || 1;
  save();
}
function migrate(){
  try{
    if(localStorage.getItem(key())) return;
    const last = JSON.parse(localStorage.getItem(LAST) || "{}");
    const old = ["brh_maison_" + slug(last.name || ""), "brh_maison_invite"];
    for(const k of old){ const v = localStorage.getItem(k); if(v){ localStorage.setItem(key(), v); return; } }
  }catch(e){}
}
function init(){
  try{
    const last = JSON.parse(localStorage.getItem(LAST) || "{}");
    state.tab = last.tab || "guide";
  }catch(e){}
  migrate();
  loadAthlete(false);
  render();
}
function getLog(w,k){
  state.log[w] = state.log[w] || {};
  state.log[w][k] = state.log[w][k] || { ex:{}, fin:false, rpe:null, pf:null, note:"" };
  return state.log[w][k];
}
function exLog(L,id){ L.ex[id] = L.ex[id] || { done:[], kg:"" }; return L.ex[id]; }

/* ---------- Rendu ---------- */
function render(){
  document.querySelectorAll('[data-action="week"]').forEach(b => b.classList.toggle("on", +b.dataset.w === state.week));
  const ph = phase(state.week);
  $("#phase").innerHTML = `Semaine ${state.week} sur 6 : <b>${ph.name.toLowerCase()}</b>. ${ph.effort}.`;
  document.querySelectorAll('[data-action="tab"]').forEach(b => b.setAttribute("aria-selected", b.dataset.tab === state.tab));
  $("#main").innerHTML = state.tab === "guide" ? guideHTML() : sessionHTML(state.tab);
}

function sessionHTML(k){
  const S = SESSIONS[k], L = getLog(state.week,k);
  let h = `<header class="sess-head">
    <h2>${S.title}</h2>
    <div class="theme">${S.theme}</div>
    <p class="meta">Environ ${S.time}, échauffement compris.</p>
  </header>
  <details><summary>Échauffement, 5 min</summary><ol>${WARMUP.map(([a,b]) => `<li>${a}<span>${b}</span></li>`).join("")}</ol></details>`;

  S.blocks.forEach(B => {
    h += `<section class="block"><div class="block-head"><div><h3>${B.name}</h3><p>${B.kind}</p></div>
      <button class="rest-btn" data-action="rest" data-s="${B.rest}">Récup ${B.rest} s</button></div>`;
    B.ex.forEach(E => {
      const n = nSets(E), el = L.ex[E.id] || { done:[], kg:"" };
      h += `<article class="ex">
        <div class="ex-top">
          <div><h4>${E.name}</h4><p class="dose"><b>${n} × ${E.reps}</b><span>${E.tempo}</span></p></div></div>
        <div class="illu">${ILLU[E.id] || ""}</div>
        <dl class="how">
          <dt>Position de départ</dt><dd>${E.how.pos}</dd>
          <dt>Le mouvement</dt><dd>${E.how.move}</dd>
          <dt>Respiration</dt><dd>${E.how.breath}</dd>
          <dt class="av">À éviter</dt><dd>${E.how.avoid}</dd>
        </dl>
        <div class="track">
          <div class="sets">${Array.from({length:n}, (_,i) => `<button class="set${el.done[i] ? " on" : ""}" data-action="set" data-ex="${E.id}" data-i="${i}" aria-pressed="${!!el.done[i]}" aria-label="Série ${i+1}">${i+1}</button>`).join("")}</div>
          <label class="kg"><input data-action="kg" data-ex="${E.id}" inputmode="${E.unit ? "text" : "decimal"}" value="${esc(el.kg||"")}" placeholder="—" aria-label="${E.unit || "Charge en kg"}"> ${E.unit || "kg"}</label>

  return h;
}

/* ---------- Son ---------- */
let ac = null;
function unlockAudio(){
  try{
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if(ac.state === "suspended") ac.resume();
  }catch(e){}
}
function beep(freq, dur){
  if(!ac) return;
  try{
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
    o.type = "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.3, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }catch(e){}
}

/* ---------- Écran allumé ---------- */
let wl = null;
async function requestWake(){
  try{
    if("wakeLock" in navigator && !wl && document.visibilityState === "visible"){
      wl = await navigator.wakeLock.request("screen");
      wl.addEventListener("release", () => { wl = null; });
    }
  }catch(e){}
}
function releaseWake(){ try{ wl && wl.release(); }catch(e){} wl = null; }
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "visible" && (state.tab !== "guide" || tick)) requestWake();
});

/* ---------- Chrono ---------- */
let tick = null, seq = [], idx = 0, endAt = 0, shown = null, onEnd = null;
const fmt = s => Math.floor(s/60) + ":" + String(s%60).padStart(2,"0");

function startSeq(phases, done){
  stopSeq();
  unlockAudio(); requestWake();
  seq = phases; idx = 0; onEnd = done || null;
  $("#bar").hidden = false;
  startPhase();
  tick = setInterval(loop, 200);
  loop();
}
function startPhase(){
  endAt = Date.now() + seq[idx].secs * 1000; shown = null;
  const p = seq[idx];
  $("#bar").className = "bar " + p.kind;
  $("#bar-label").textContent = p.label;
  $("#bar-sub").textContent = p.sub || "";
}
function loop(){
  const left = Math.max(0, Math.ceil((endAt - Date.now()) / 1000));
  if(left !== shown){
    shown = left;
    $("#bar-time").textContent = fmt(left);
    if(left > 0 && left <= 3) beep(660, 0.12);
  }
  if(left <= 0){
    idx++;
    if(idx >= seq.length){
      beep(990, 0.7);
      const cb = onEnd; stopSeq(); if(cb) cb();
      return;
    }
    beep(seq[idx].kind === "work" ? 990 : 520, 0.35);
    startPhase();
  }
}
function stopSeq(){
  clearInterval(tick); tick = null;
  $("#bar").hidden = true;
}
$("#bar-stop").addEventListener("click", stopSeq);


/* ---------- Événements ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-action]");
  if(!b) return;
  const a = b.dataset.action, k = state.tab;

  if(a === "tab"){
    state.tab = b.dataset.tab; save(); render();
    window.scrollTo({ top: $(".tabs").offsetTop + 1 });
    if(state.tab === "guide" && !tick) releaseWake(); else requestWake();
    return;
  }
  if(a === "week"){ state.week = +b.dataset.w; save(); render(); return; }
  if(k === "guide") return;
  const L = getLog(state.week,k);

  switch(a){
    case "set": {
      const ex = exLog(L, b.dataset.ex), i = +b.dataset.i;
      ex.done[i] = !ex.done[i]; save();
      b.classList.toggle("on", ex.done[i]); b.setAttribute("aria-pressed", ex.done[i]);
      break;
    }
    case "rest":
      startSeq([{ label:"Récupération", sub:"Reprends au bip", secs:+b.dataset.s, kind:"rest" }]);
      break;
    case "reset":
      if(confirm("Effacer les données de cette séance pour cette semaine ?")){
        delete state.log[state.week][k]; save(); render();
      }
      break;
  }
});

document.addEventListener("input", e => {
  const t = e.target, a = t.dataset.action;
  if(!a || state.tab === "guide") return;
  const L = getLog(state.week, state.tab);
  if(a === "kg"){ exLog(L, t.dataset.ex).kg = t.value.trim(); save(); }
});


init();
